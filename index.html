<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2F5D50">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">

<style>
  :root{
    --paper:#EEF3ED;
    --surface:#FFFFFF;
    --ink:#1B2A22;
    --ink-soft:#5B6B60;
    --ink-faint:#8A9990;
    --line:#D8DEd3;
    --primary:#2F5D50;
    --primary-dark:#213F36;
    --primary-tint:#E4EDE8;
    --gold:#B8862E;
    --gold-tint:#F3E9D4;
    --profit:#2E7D53;
    --profit-tint:#E4F2E9;
    --cost:#A34A34;
    --cost-tint:#F5E6E1;
    --danger:#B3402F;
    --radius:6px;
    --font-head:'Lora',serif;
    --font-body:'IBM Plex Sans',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
  }
  #app{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
    position:relative;
  }
  ::selection{background:var(--gold-tint);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ---- Header ---- */
  .topbar{
    padding:18px 18px 14px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    position:sticky;
    top:0;
    z-index:5;
  }
  .brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .brand h1{
    font-family:var(--font-head);
    font-size:22px;
    font-weight:700;
    margin:0;
    color:var(--primary-dark);
    letter-spacing:0.2px;
  }
  .brand .date{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--ink-faint);
  }
  .statstrip{
    display:flex;
    margin-top:12px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    background:var(--surface);
  }
  .statcell{
    flex:1;
    padding:10px 12px;
    text-align:left;
  }
  .statcell + .statcell{border-left:1px dashed var(--line);}
  .statcell .label{
    font-size:11px;
    color:var(--ink-soft);
    margin:0 0 3px;
  }
  .statcell .value{
    font-family:var(--font-mono);
    font-size:16px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
  }
  .statcell .value.profit{color:var(--profit);}

  /* ---- Content ---- */
  main{
    flex:1;
    padding:16px 16px 90px;
  }
  h2.section-title{
    font-family:var(--font-head);
    font-size:17px;
    font-weight:600;
    margin:0 0 12px;
    color:var(--primary-dark);
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input[type=text],
  .field input[type=number],
  .field input[type=date],
  .field select,
  .field textarea{
    width:100%;
    padding:10px 11px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    color:var(--ink);
    font-size:15px;
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none;
    border-color:var(--primary);
  }
  .field.amount input{
    font-family:var(--font-mono);
    font-size:18px;
    font-weight:600;
  }

  /* segmented control */
  .segmented{
    display:flex;
    border:1px solid var(--primary);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .segmented button{
    flex:1;
    padding:10px 8px;
    border:none;
    background:#fff;
    color:var(--primary);
    font-size:13.5px;
    font-weight:500;
  }
  .segmented button + button{border-left:1px solid var(--primary);}
  .segmented button.active{background:var(--primary);color:#fff;}

  /* chips */
  .chiprow{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    padding:7px 13px;
    border:1px solid var(--line);
    border-radius:20px;
    background:#fff;
    font-size:13.5px;
    color:var(--ink-soft);
    font-family:var(--font-mono);
  }
  .chip.active{
    background:var(--gold-tint);
    border-color:var(--gold);
    color:var(--gold);
    font-weight:600;
  }
  .chip.custom-active{
    background:var(--primary-tint);
    border-color:var(--primary);
    color:var(--primary-dark);
  }

  /* preview breakdown */
  .breakdown{
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    background:var(--paper);
  }
  .brow{
    display:flex;
    justify-content:space-between;
    padding:5px 0;
    font-size:13.5px;
  }
  .brow .val{
    font-family:var(--font-mono);
    font-variant-numeric:tabular-nums;
  }
  .brow.cost .val{color:var(--cost);}
  .brow.divider{border-top:1px dashed var(--line);margin-top:4px;padding-top:9px;}
  .brow.profit{font-weight:700;font-size:15.5px;}
  .brow.profit .val{color:var(--profit);}

  .btn{
    display:block;
    width:100%;
    padding:13px;
    border:none;
    border-radius:var(--radius);
    background:var(--primary);
    color:#fff;
    font-size:15px;
    font-weight:600;
    text-align:center;
  }
  .btn:active{background:var(--primary-dark);}
  .btn.secondary{
    background:#fff;
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-weight:500;
  }
  .btn.danger{background:var(--danger);}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{flex:1;}

  /* ---- History ---- */
  .filterbar{margin-bottom:14px;}
  .search{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    font-size:14px;
    margin-bottom:10px;
  }
  .datehead{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--ink-faint);
    margin:16px 0 6px;
    padding-bottom:4px;
    border-bottom:1px solid var(--line);
  }
  .txrow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 4px;
    border-bottom:1px solid var(--line);
  }
  .txrow:active{background:var(--primary-tint);}
  .txrow .txleft{flex:1;min-width:0;}
  .txrow .txtype{
    font-size:14px;
    font-weight:500;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .txrow .txmeta{
    font-size:12px;
    color:var(--ink-faint);
    margin-top:2px;
  }
  .tag{
    display:inline-block;
    font-size:10.5px;
    padding:1px 6px;
    border-radius:10px;
    margin-right:6px;
    font-family:var(--font-mono);
  }
  .tag.bill{background:var(--primary-tint);color:var(--primary-dark);}
  .tag.gift{background:var(--gold-tint);color:var(--gold);}
  .txrow .txright{text-align:right;padding-left:10px;}
  .txrow .txprofit{
    font-family:var(--font-mono);
    font-weight:600;
    font-size:14.5px;
    color:var(--profit);
  }
  .txrow .txamount{
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--ink-faint);
  }
  .emptystate{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-faint);
  }
  .emptystate .big{font-family:var(--font-head);font-size:16px;color:var(--ink-soft);margin-bottom:4px;}
  .summarybar{
    display:flex;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--surface);
    margin-top:14px;
    overflow:hidden;
  }

  /* ---- Dashboard ---- */
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .kpi{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
  }
  .kpi .label{font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  .kpi .value{font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--primary-dark);}
  .barlist-row{margin-bottom:10px;}
  .barlist-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
  .barlist-head .name{color:var(--ink);}
  .barlist-head .amt{font-family:var(--font-mono);color:var(--profit);font-weight:600;}
  .bartrack{height:7px;background:var(--paper);border-radius:4px;overflow:hidden;}
  .barfill{height:100%;background:var(--primary);border-radius:4px;}

  /* ---- Settings ---- */
  .taglist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .taglist .chip{position:relative;padding-right:26px;}
  .taglist .chip .x{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--danger);}
  .addrow{display:flex;gap:8px;}
  .addrow input{flex:1;}
  .addrow button{
    padding:0 16px;
    border:1px solid var(--primary);
    background:#fff;
    color:var(--primary);
    border-radius:var(--radius);
    font-weight:600;
  }

  /* ---- Bottom nav ---- */
  .bottomnav{
    position:sticky;
    bottom:0;
    display:flex;
    background:var(--surface);
    border-top:1px solid var(--line);
    z-index:5;
  }
  .bottomnav button{
    flex:1;
    background:none;
    border:none;
    padding:9px 2px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    color:var(--ink-faint);
    font-size:10px;
  }
  .bottomnav button.active{color:var(--primary);}
  .bottomnav svg{width:18px;height:18px;}

  /* toast */
  .toast{
    position:fixed;
    left:50%;
    bottom:80px;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:20px;
    font-size:13.5px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:20;
    white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .helper{font-size:11.5px;color:var(--ink-faint);margin-top:5px;}
</style>
</head>

  <header class="topbar">

  "use strict";

  // Works two ways: inside a Claude artifact it uses Claude's built-in cloud storage.
  // Hosted anywhere else as a plain webpage (Netlify, GitHub Pages, etc.) there is no
  // window.storage, so this fills in the same get/set/delete/list API using the
  // browser's own localStorage — data then saves right on the device/browser you're
  // using, with no account or server needed.
  if(typeof window.storage === 'undefined'){
    window.storage = {
      get: function(key){
        return new Promise(function(resolve, reject){
          var raw = localStorage.getItem('khata:'+key);
          if(raw===null){ reject(new Error('not found: '+key)); return; }
          resolve({ key: key, value: raw, shared: false });
        });
      },
      set: function(key, value){
        return new Promise(function(resolve, reject){
          try{
            localStorage.setItem('khata:'+key, value);
            resolve({ key: key, value: value, shared: false });
          }catch(e){ reject(e); }
        });
      },
      delete: function(key){
        return new Promise(function(resolve){
          localStorage.removeItem('khata:'+key);
          resolve({ key: key, deleted: true, shared: false });
        });
      },
      list: function(prefix){
        return new Promise(function(resolve){
          var keys = [];
          for(var i=0;i<localStorage.length;i++){
            var k = localStorage.key(i);
            if(k.indexOf('khata:')===0){
              var short = k.slice(6);
              if(!prefix || short.indexOf(prefix)===0) keys.push(short);
            }
          }
          resolve({ keys: keys, prefix: prefix, shared: false });
        });
      }
    };
  }

  var state = {
    settings: null,
    transactions: [],
    legacyNotes: [],
    view: 'entry',
    editingId: null,
    entryDraft: null,
    historyFilter: { type:'all', range:'all', search:'' }
  };

  var REQUIRED_BRANDS = ['Ajio','Make My Trip','Make My Trip Bus','Make My Trip Hotel','Ease My Trip','Tata Cliq'];

  function ensureBrands(settings){
    var changed = false;
    var lowerList = settings.giftBrands.map(function(b){return b.toLowerCase();});
    REQUIRED_BRANDS.forEach(function(b){
      if(lowerList.indexOf(b.toLowerCase())===-1){
        var otherIdx = settings.giftBrands.indexOf('Other');
        var insertAt = otherIdx>-1 ? otherIdx : settings.giftBrands.length;
        settings.giftBrands.splice(insertAt,0,b);
        lowerList.push(b.toLowerCase());
        changed = true;
      }
    });
    return changed;
  }

  var REQUIRED_CATEGORIES = ['Flight Ticket','Hotel Booking','Bus Booking','Online Order'];

  function ensureCategories(settings){
    var changed = false;
    var lowerList = settings.billCategories.map(function(c){return c.toLowerCase();});
    REQUIRED_CATEGORIES.forEach(function(c){
      if(lowerList.indexOf(c.toLowerCase())===-1){
        var otherIdx = settings.billCategories.indexOf('Other');
        var insertAt = otherIdx>-1 ? otherIdx : settings.billCategories.length;
        settings.billCategories.splice(insertAt,0,c);
        lowerList.push(c.toLowerCase());
        changed = true;
      }
    });
    return changed;
  }

  function defaultSettings(){
    return {
      shopName: 'Khata',
      billCategories: ['Electricity Bill','Gas Bill','Mobile Recharge','DTH Recharge','Broadband Bill','Water Bill','Insurance Premium','Flight Ticket','Hotel Booking','Bus Booking','Online Order','Other'],
      giftBrands: ['Flipkart','Myntra','Google Play','Zomato','Swiggy','BookMyShow','Ajio','Make My Trip','Make My Trip Bus','Make My Trip Hotel','Ease My Trip','Tata Cliq','Domino\'s','Amazon Pay','Other'],
      costPresets: [20,15,10,5],
      customerPresets: [8,10,12],
      legacyMigrated: false,
      legacyMigratedV2: false
    };
  }

  function blankDraft(){
    return {
      id:null,
      txType:'bill',
      category: null,
      brand: null,
      amount:'',
      costPct:'',
      customerPct:'',
      customerName:'',
      date: todayISO(),
      note:''
    };
  }

  function todayISO(){
    var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function fmtDate(iso){
    var d = new Date(iso+'T00:00:00');
    return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
  }

  function fmtINR(n){
    n = Math.round(n*100)/100;
    var opts = (n%1===0) ? {maximumFractionDigits:0} : {maximumFractionDigits:2};
    return '₹' + n.toLocaleString('en-IN', opts);
  }

  function calc(amount, costPct, custPct){
    amount = parseFloat(amount)||0;
    costPct = parseFloat(costPct)||0;
    custPct = parseFloat(custPct)||0;
    var cost = amount * (1 - costPct/100);
    var customerPaid = amount * (1 - custPct/100);
    var profit = customerPaid - cost;
    return {cost:cost, customerPaid:customerPaid, profit:profit};
  }

  function uid(){
    return 't_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

  function parseLegacyLines(text){
    var lines = text.split('\n');
    var out = [];
    lines.forEach(function(line){
      var trimmed = line.trim();
      if(!trimmed) return;
      var m = trimmed.match(/^(-?\d+(?:\.\d+)?)\s+(.*)$/);
      if(!m) return;
      out.push({ id: uid(), amount: parseFloat(m[1]), note: m[2].trim() });
    });
    return out;
  }

  // Turns a raw note line into a best-guess transaction shape. Entries that mention
  // "customer" are treated as paid jobs at the standard 20% / 10% rates; entries
  // without "customer" (family/personal) are logged at 0% so they show in history
  // without inventing profit that was never actually charged.
  function classifyLegacyNote(noteText){
    var text = noteText.toLowerCase();
    var out = { txType:'bill', category:null, brand:null };

    if(/gc profit/.test(text)){
      out.txType='gift'; out.brand='Other';
      return out;
    }

    var brandMap = [
      [/ease my trip/, 'Ease My Trip'],
      [/tata cliq/, 'Tata Cliq'],
      [/mmt rail/, 'Make My Trip'],
      [/\bmmt\b/, 'Make My Trip'],
      [/ajio/, 'Ajio'],
      [/\bbms\b/, 'BookMyShow'],
      [/domino/, 'Domino\'s']
    ];
    for(var i=0;i<brandMap.length;i++){
      if(brandMap[i][0].test(text)){
        out.txType='gift'; out.brand=brandMap[i][1];
        return out;
      }
    }

    var catMap = [
      [/light bill|elec/, 'Electricity Bill'],
      [/gas/, 'Gas Bill'],
      [/water/, 'Water Bill'],
      [/\blic\b/, 'Insurance Premium'],
      [/broadband/, 'Broadband Bill'],
      [/tata play|dth/, 'DTH Recharge'],
      [/jio postpaid|recharge/, 'Mobile Recharge'],
      [/flight|ticket/, 'Flight Ticket'],
      [/hotel/, 'Hotel Booking'],
      [/\bbus\b/, 'Bus Booking'],
      [/amazon|order|blinkit|zepto/, 'Online Order']
    ];
    for(var j=0;j<catMap.length;j++){
      if(catMap[j][0].test(text)){
        out.category = catMap[j][1];
        return out;
      }
    }

    out.category='Other';
    return out;
  }

  function migrateLegacyToTransactions(){
    var notes = state.legacyNotes;
    if(!notes.length) return;
    var start = new Date('2026-05-15T00:00:00');
    var end = new Date(todayISO()+'T00:00:00');
    var totalMs = Math.max(end.getTime()-start.getTime(), 0);
    var n = notes.length;
    var baseTs = Date.now() - n*1000;
    var newTx = notes.map(function(note, i){
      var frac = n>1 ? i/(n-1) : 0;
      var d = new Date(start.getTime() + frac*totalMs);
      var dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      var cls = classifyLegacyNote(note.note);
      return {
        id: uid(),
        txType: cls.txType,
        category: cls.txType==='bill' ? cls.category : null,
        brand: cls.txType==='gift' ? cls.brand : null,
        amount: note.amount,
        costPct: 100,
        customerPct: 0,
        cost: 0,
        customerPaid: note.amount,
        profit: note.amount,
        directProfit: true,
        customerName: '',
        date: dateStr,
        note: note.note,
        createdAt: baseTs + i*1000
      };
    });
    state.transactions = state.transactions.concat(newTx);
  }

  // One-time correction: an earlier version of this import wrongly assumed each line was
  // a bill amount and applied a 20%/10% estimate. The numbers you wrote were actually your
  // profit directly, so this rewrites those same entries (matched by their original text)
  // to record the full amount as profit, without touching anything you've entered since.
  function fixLegacyProfits(){
    var expected = parseLegacyLines(SEED_LEGACY_TEXT);
    var fixed = 0;
    for(var i=0;i<expected.length;i++){
      var t = state.transactions[i];
      if(!t) break;
      if(t.amount===expected[i].amount){
        t.costPct = 100; t.customerPct = 0; t.cost = 0;
        t.customerPaid = t.amount; t.profit = t.amount; t.directProfit = true;
        fixed++;
      }
    }
    return fixed;
  }

  // ---------- cloud sync (optional, via the user's own free Firebase project) ----------
  var CLOUD_ENABLED = false;
  var cloudDb = null;
  var cloudPushTimer = null;

  function loadFirebaseConfig(){
    try{
      var raw = localStorage.getItem('khata:firebaseConfig');
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  function parseFirebaseConfigText(text){
    var start = text.indexOf('{');
    var end = text.lastIndexOf('}');
    if(start===-1 || end===-1 || end<start) throw new Error('Could not find a { ... } config object in that text');
    var objText = text.slice(start, end+1);
    var obj = Function('"use strict"; return (' + objText + ');')();
    if(!obj || !obj.apiKey || !obj.projectId) throw new Error('That doesn\'t look like a complete Firebase config (missing apiKey or projectId)');
    return obj;
  }

  function loadFirebaseScripts(){
    return new Promise(function(resolve, reject){
      if(window.firebase && window.firebase.firestore){ resolve(); return; }
      var s1 = document.createElement('script');
      s1.src = 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js';
      s1.onload = function(){
        var s2 = document.createElement('script');
        s2.src = 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js';
        s2.onload = resolve;
        s2.onerror = function(){ reject(new Error('Could not load Firestore library')); };
        document.head.appendChild(s2);
      };
      s1.onerror = function(){ reject(new Error('Could not load Firebase library')); };
      document.head.appendChild(s1);
    });
  }

  async function initCloud(){
    var cfg = loadFirebaseConfig();
    if(!cfg) { CLOUD_ENABLED = false; return false; }
    try{
      await loadFirebaseScripts();
      if(!firebase.apps || !firebase.apps.length){ firebase.initializeApp(cfg); }
      cloudDb = firebase.firestore();
      CLOUD_ENABLED = true;
      return true;
    }catch(e){
      console.error('cloud init failed', e);
      CLOUD_ENABLED = false;
      return false;
    }
  }

  async function cloudPull(){
    if(!CLOUD_ENABLED) return null;
    try{
      var snap = await cloudDb.collection('khata').doc('data').get();
      if(!snap.exists) return null;
      return snap.data();
    }catch(e){
      console.error('cloud pull failed', e);
      return null;
    }
  }

  async function cloudPush(){
    if(!CLOUD_ENABLED) return;
    try{
      await cloudDb.collection('khata').doc('data').set({
        settings: state.settings,
        transactions: state.transactions,
        legacyNotes: state.legacyNotes,
        updatedAt: Date.now()
      });
    }catch(e){
      console.error('cloud push failed', e);
      showToast('Could not sync to cloud — saved on this device');
    }
  }

  function scheduleCloudPush(){
    if(!CLOUD_ENABLED) return;
    clearTimeout(cloudPushTimer);
    cloudPushTimer = setTimeout(cloudPush, 300);
  }

  // ---------- storage ----------
  async function loadData(){
    await initCloud();
    if(CLOUD_ENABLED){
      var cloudData = await cloudPull();
      if(cloudData){
        state.settings = cloudData.settings || defaultSettings();
        state.transactions = cloudData.transactions || [];
        state.legacyNotes = cloudData.legacyNotes || [];
        var chg = ensureBrands(state.settings);
        if(ensureCategories(state.settings)) chg = true;
        if(state.settings.legacyMigrated===undefined){ state.settings.legacyMigrated = true; chg = true; }
        if(state.settings.legacyMigratedV2===undefined){ state.settings.legacyMigratedV2 = true; chg = true; }
        state.entryDraft = blankDraft();
        document.getElementById('todayDate').textContent = fmtDate(todayISO());
        if(chg) await saveSettings();
        renderAll();
        return;
      }
    }
    try{
      var s = await window.storage.get('settings', false);
      state.settings = JSON.parse(s.value);
      var settingsChanged = ensureBrands(state.settings);
      if(ensureCategories(state.settings)) settingsChanged = true;
      if(state.settings.legacyMigrated===undefined){ state.settings.legacyMigrated = false; settingsChanged = true; }
      if(state.settings.legacyMigratedV2===undefined){ state.settings.legacyMigratedV2 = false; settingsChanged = true; }
      if(settingsChanged) await saveSettings();
    }catch(e){
      state.settings = defaultSettings();
      await saveSettings();
    }
    try{
      var t = await window.storage.get('transactions', false);
      state.transactions = JSON.parse(t.value);
    }catch(e){
      state.transactions = [];
    }
    try{
      var ln = await window.storage.get('legacyNotes', false);
      state.legacyNotes = JSON.parse(ln.value);
    }catch(e){
      state.legacyNotes = parseLegacyLines(SEED_LEGACY_TEXT);
      await saveLegacyNotes();
    }

    if(!state.settings.legacyMigrated && state.legacyNotes.length>0){
      migrateLegacyToTransactions();
      await saveTransactions();
      state.legacyNotes = [];
      await saveLegacyNotes();
      state.settings.legacyMigrated = true;
      state.settings.legacyMigratedV2 = true;
      await saveSettings();
      showToast('Imported '+state.transactions.length+' old entries into History');
    } else if(!state.settings.legacyMigratedV2){
      var fixedCount = fixLegacyProfits();
      if(fixedCount>0){
        await saveTransactions();
        showToast('Fixed profit on '+fixedCount+' imported entries');
      }
      state.settings.legacyMigratedV2 = true;
      await saveSettings();
    }

    if(CLOUD_ENABLED) await cloudPush();

    state.entryDraft = blankDraft();
    document.getElementById('todayDate').textContent = fmtDate(todayISO());
    renderAll();
  }

  async function saveSettings(){
    try{ await window.storage.set('settings', JSON.stringify(state.settings), false); }
    catch(e){ console.error('settings save failed', e); showToast('Could not save settings'); }
    scheduleCloudPush();
  }

  async function saveTransactions(){
    try{ await window.storage.set('transactions', JSON.stringify(state.transactions), false); }
    catch(e){ console.error('transactions save failed', e); showToast('Could not save — try again'); }
    scheduleCloudPush();
  }

  async function saveLegacyNotes(){
    try{ await window.storage.set('legacyNotes', JSON.stringify(state.legacyNotes), false); }
    catch(e){ console.error('legacy notes save failed', e); showToast('Could not save — try again'); }
    scheduleCloudPush();
  }

  // ---------- header stats ----------
  function computeStats(list){
    var out = {count:0, received:0, cost:0, profit:0};
    list.forEach(function(t){
      out.count++;
      out.received += t.customerPaid;
      out.cost += t.cost;
      out.profit += t.profit;
    });
    return out;
  }

  function renderStatstrip(){
    var today = todayISO();
    var todays = state.transactions.filter(function(t){return t.date===today;});
    var all = state.transactions;
    var tStats = computeStats(todays);
    var aStats = computeStats(all);
    document.getElementById('statstrip').innerHTML =
      '<div class="statcell"><p class="label">Today · '+tStats.count+' entr'+(tStats.count===1?'y':'ies')+'</p><p class="value profit">'+fmtINR(tStats.profit)+'</p></div>'+
      '<div class="statcell"><p class="label">All-time profit</p><p class="value profit">'+fmtINR(aStats.profit)+'</p></div>';
    document.getElementById('shopNameDisplay').textContent = state.settings.shopName || 'Khata';
  }

  function renderAll(){
    renderStatstrip();
    renderView();
    document.querySelectorAll('.bottomnav button').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-nav')===state.view);
    });
  }

  function renderView(){
    var c = document.getElementById('content');
    if(state.view==='entry') c.innerHTML = entryTemplate();
    else if(state.view==='history') c.innerHTML = historyTemplate();
    else if(state.view==='notes') c.innerHTML = notesTemplate();
    else if(state.view==='dashboard') c.innerHTML = dashboardTemplate();
    else if(state.view==='settings') c.innerHTML = settingsTemplate();

    if(state.view==='entry') { wireEntryEvents(); updatePreview(); }
    if(state.view==='history') { wireHistoryEvents(); updateHistoryList(); }
    if(state.view==='notes') { wireNotesEvents(); updateNotesList(); }
    if(state.view==='settings') wireSettingsEvents();
  }

  function chipRow(kind, presets, current){
    var isCustomVal = current!=='' && presets.indexOf(parseFloat(current))===-1;
    var html = '<div class="chiprow" data-chipgroup="'+kind+'">';
    presets.forEach(function(p){
      var active = (parseFloat(current)===p && !isCustomVal);
      html += '<button type="button" class="chip'+(active?' active':'')+'" data-chipval="'+p+'" data-chipkind="'+kind+'">'+p+'%</button>';
    });
    html += '<span style="display:inline-flex;align-items:center;">'+
      '<input type="number" class="chip" style="width:76px;text-align:center;'+(isCustomVal?'':'color:var(--ink-faint)')+'" placeholder="Custom" id="custom-'+kind+'" value="'+(isCustomVal? esc(current):'')+'">'+
      '</span></div>';
    return html;
  }

  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function wireEntryEvents(){
    var content = document.getElementById('content');

    var typeToggle = document.getElementById('typeToggle');
    typeToggle.addEventListener('click', function(e){
      var btn = e.target.closest('button[data-type]');
      if(!btn) return;
      state.entryDraft.txType = btn.getAttribute('data-type');
      renderView();
    });

    var catEl = document.getElementById('f-category');
    if(catEl) catEl.addEventListener('change', function(){ state.entryDraft.category = catEl.value; });
    var brandEl = document.getElementById('f-brand');
    if(brandEl) brandEl.addEventListener('input', function(){ state.entryDraft.brand = brandEl.value; });

    document.getElementById('f-amount').addEventListener('input', function(e){
      state.entryDraft.amount = e.target.value;
      updatePreview();
    });
    document.getElementById('f-customer').addEventListener('input', function(e){ state.entryDraft.customerName = e.target.value; });
    document.getElementById('f-date').addEventListener('change', function(e){ state.entryDraft.date = e.target.value; });
    document.getElementById('f-note').addEventListener('input', function(e){ state.entryDraft.note = e.target.value; });

    content.querySelectorAll('.chiprow').forEach(function(row){
      row.addEventListener('click', function(e){
        var chip = e.target.closest('.chip[data-chipval]');
        if(!chip) return;
        var kind = chip.getAttribute('data-chipkind');
        var val = chip.getAttribute('data-chipval');
        if(kind==='cost') state.entryDraft.costPct = val; else state.entryDraft.customerPct = val;
        var customInput = document.getElementById('custom-'+kind);
        if(customInput) customInput.value='';
        row.querySelectorAll('.chip[data-chipval]').forEach(function(c){c.classList.toggle('active', c===chip);});
        updatePreview();
      });
    });
    ['cost','customer'].forEach(function(kind){
      var input = document.getElementById('custom-'+kind);
      if(!input) return;
      input.addEventListener('input', function(){
        if(kind==='cost') state.entryDraft.costPct = input.value; else state.entryDraft.customerPct = input.value;
        var row = content.querySelector('.chiprow[data-chipgroup="'+kind+'"]');
        row.querySelectorAll('.chip[data-chipval]').forEach(function(c){c.classList.remove('active');});
        updatePreview();
      });
    });

    document.getElementById('saveEntry').addEventListener('click', onSaveEntry);
    var cancelBtn = document.getElementById('cancelEdit');
    if(cancelBtn) cancelBtn.addEventListener('click', function(){
      state.editingId = null;
      state.entryDraft = blankDraft();
      renderView();
    });
  }

  async function onSaveEntry(){
    var d = state.entryDraft;
    var amount = parseFloat(d.amount);
    var costPct = parseFloat(d.costPct);
    var custPct = parseFloat(d.customerPct);
    if(!amount || amount<=0){ showToast('Enter a valid amount'); return; }
    if(isNaN(costPct)){ showToast('Choose or enter your cost %'); return; }
    if(isNaN(custPct)){ showToast('Choose or enter customer %'); return; }
    if(d.txType==='bill' && !d.category) d.category = state.settings.billCategories[0];
    if(d.txType==='gift' && !d.brand){ showToast('Enter the gift card brand'); return; }

    var r = calc(amount, costPct, custPct);
    var record = {
      id: state.editingId || uid(),
      txType: d.txType,
      category: d.txType==='bill' ? d.category : null,
      brand: d.txType==='gift' ? d.brand : null,
      amount: amount,
      costPct: costPct,
      customerPct: custPct,
      cost: r.cost,
      customerPaid: r.customerPaid,
      profit: r.profit,
      customerName: d.customerName.trim(),
      date: d.date || todayISO(),
      note: d.note.trim(),
      createdAt: state.editingId ? undefined : Date.now()
    };

    if(state.editingId){
      var idx = state.transactions.findIndex(function(t){return t.id===state.editingId;});
      if(idx>-1){ record.createdAt = state.transactions[idx].createdAt; state.transactions[idx] = record; }
      state.editingId = null;
      showToast('Entry updated');
    } else {
      state.transactions.push(record);
      showToast('Saved — profit '+fmtINR(r.profit));
    }
    await saveTransactions();

    if(!state.settings.giftBrands.includes(record.brand) && record.brand && record.brand!=='Other'){
      state.settings.giftBrands.splice(state.settings.giftBrands.length-1, 0, record.brand);
      await saveSettings();
    }

    state.entryDraft = blankDraft();
    renderAll();
  }

  // ================= HISTORY =================
  function filteredTransactions(){
    var f = state.historyFilter;
    var list = state.transactions.slice();
    if(f.type!=='all') list = list.filter(function(t){return t.txType===f.type;});
    if(f.range!=='all'){
      var today = new Date(todayISO()+'T00:00:00');
      list = list.filter(function(t){
        var dd = new Date(t.date+'T00:00:00');
        var diffDays = Math.round((today-dd)/86400000);
        if(f.range==='today') return diffDays===0;
        if(f.range==='week') return diffDays>=0 && diffDays<7;
        if(f.range==='month') return diffDays>=0 && diffDays<31;
        return true;
      });
    }
    if(f.search.trim()){
      var s = f.search.trim().toLowerCase();
      list = list.filter(function(t){
        return (t.customerName||'').toLowerCase().includes(s) ||
               (t.note||'').toLowerCase().includes(s) ||
               (t.category||'').toLowerCase().includes(s) ||
               (t.brand||'').toLowerCase().includes(s);
      });
    }
    list.sort(function(a,b){ return (b.date+String(b.createdAt||0)).localeCompare(a.date+String(a.createdAt||0)); });
    return list;
  }

  function historyTemplate(){
    var f = state.historyFilter;
    return ''+
    '<h2 class="section-title">History</h2>'+
    '<input type="text" class="search" id="searchInput" placeholder="Search by name, note or category" value="'+esc(f.search)+'">'+
    '<div class="filterbar">'+
      '<div class="chiprow" id="typeFilter" style="margin-bottom:8px;">'+
        ['all','bill','gift'].map(function(v){
          var label = v==='all'?'All':(v==='bill'?'Bill payment':'Gift card resale');
          return '<button type="button" class="chip'+(f.type===v?' custom-active':'')+'" data-val="'+v+'">'+label+'</button>';
        }).join('')+
      '</div>'+
      '<div class="chiprow" id="rangeFilter">'+
        ['all','today','week','month'].map(function(v){
          var label = v==='all'?'All time':v.charAt(0).toUpperCase()+v.slice(1);
          return '<button type="button" class="chip'+(f.range===v?' custom-active':'')+'" data-val="'+v+'">'+label+'</button>';
        }).join('')+
      '</div>'+
    '</div>'+
    '<div id="historyList"></div>'+
    '<div id="historySummary"></div>'+
    '<button class="btn secondary" id="exportCsv" style="margin-top:14px;">Export filtered as CSV</button>';
  }

  function updateHistoryList(){
    var list = filteredTransactions();
    var listEl = document.getElementById('historyList');
    if(list.length===0){
      listEl.innerHTML = '<div class="emptystate"><p class="big">No entries here</p><p>Try a different filter, or add your first entry today.</p></div>';
    } else {
      var lastDate = null;
      var html = '';
      list.forEach(function(t){
        if(t.date!==lastDate){ html += '<div class="datehead">'+fmtDate(t.date)+'</div>'; lastDate=t.date; }
        var title = t.txType==='bill' ? t.category : t.brand;
        var rateLabel = t.directProfit ? 'profit logged directly' : (t.costPct+'%/'+t.customerPct+'%');
        var meta = (t.customerName? esc(t.customerName)+' · ' : '') + rateLabel + (t.note? ' · '+esc(t.note):'');
        html += '<div class="txrow" data-id="'+t.id+'">'+
          '<div class="txleft">'+
            '<div class="txtype"><span class="tag '+(t.txType==='bill'?'bill':'gift')+'">'+(t.txType==='bill'?'Bill':'Gift card')+'</span>'+esc(title)+'</div>'+
            '<div class="txmeta">'+meta+'</div>'+
          '</div>'+
          '<div class="txright"><div class="txprofit">'+fmtINR(t.profit)+'</div><div class="txamount">of '+fmtINR(t.amount)+'</div></div>'+
        '</div>';
      });
      listEl.innerHTML = html;
      listEl.querySelectorAll('.txrow').forEach(function(row){
        row.addEventListener('click', function(){ openEntryDetail(row.getAttribute('data-id')); });
      });
    }
    var stats = computeStats(list);
    document.getElementById('historySummary').innerHTML =
      '<div class="summarybar">'+
        '<div class="statcell"><p class="label">'+stats.count+' entries</p><p class="value">'+fmtINR(stats.received)+'</p></div>'+
        '<div class="statcell"><p class="label">Profit</p><p class="value profit">'+fmtINR(stats.profit)+'</p></div>'+
      '</div>';
  }

  function openEntryDetail(id){
    var t = state.transactions.find(function(x){return x.id===id;});
    if(!t) return;
    var doDelete = confirm('Delete this entry?\\n\\n'+(t.txType==='bill'?t.category:t.brand)+' — '+fmtINR(t.amount)+'\\n\\nPress Cancel to edit instead, OK to delete.');
    if(doDelete){
      state.transactions = state.transactions.filter(function(x){return x.id!==id;});
      saveTransactions();
      showToast('Entry deleted');
      renderAll();
    } else {
      state.editingId = t.id;
      state.entryDraft = {
        id:t.id, txType:t.txType, category:t.category, brand:t.brand,
        amount:String(t.amount), costPct:String(t.costPct), customerPct:String(t.customerPct),
        customerName:t.customerName||'', date:t.date, note:t.note||''
      };
      state.view = 'entry';
      renderAll();
    }
  }

  function wireHistoryEvents(){
    document.getElementById('searchInput').addEventListener('input', function(e){
      state.historyFilter.search = e.target.value;
      updateHistoryList();
    });
    document.getElementById('typeFilter').addEventListener('click', function(e){
      var btn = e.target.closest('.chip'); if(!btn) return;
      state.historyFilter.type = btn.getAttribute('data-val');
      document.querySelectorAll('#typeFilter .chip').forEach(function(c){c.classList.toggle('custom-active', c===btn);});
      updateHistoryList();
    });
    document.getElementById('rangeFilter').addEventListener('click', function(e){
      var btn = e.target.closest('.chip'); if(!btn) return;
      state.historyFilter.range = btn.getAttribute('data-val');
      document.querySelectorAll('#rangeFilter .chip').forEach(function(c){c.classList.toggle('custom-active', c===btn);});
      updateHistoryList();
    });
    document.getElementById('exportCsv').addEventListener('click', function(){
      exportCsv(filteredTransactions());
    });
  }

  function exportCsv(list){
    if(list.length===0){ showToast('Nothing to export'); return; }
    var header = ['Date','Type','Category/Brand','Customer','Amount','My %','Customer %','My Cost','Customer Paid','Profit','Note'];
    var rows = list.map(function(t){
      return [t.date, t.txType, (t.txType==='bill'?t.category:t.brand), t.customerName||'', t.amount, t.costPct, t.customerPct, t.cost.toFixed(2), t.customerPaid.toFixed(2), t.profit.toFixed(2), (t.note||'').replace(/,/g,';')].join(',');
    });
    var csv = header.join(',')+'\\n'+rows.join('\\n');
    var blob = new Blob([csv], {type:'text/csv'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'khata-export-'+todayISO()+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ================= NOTES (imported from old notes app) =================
  function notesTemplate(){
    var total = state.legacyNotes.reduce(function(s,n){return s+n.amount;}, 0);
    return ''+
    '<h2 class="section-title">Imported notes</h2>'+
    '<div class="card">'+
      '<p class="helper" style="margin-top:0;">Everything from your old notes app, brought in as-is — bills, recharges, customer payments and personal spends together, just like you had them written down.</p>'+
      '<div class="summarybar" style="margin-top:0;">'+
        '<div class="statcell"><p class="label">'+state.legacyNotes.length+' lines</p><p class="value">Total</p></div>'+
        '<div class="statcell"><p class="label">&nbsp;</p><p class="value" id="legacyTotal">'+fmtINR(total)+'</p></div>'+
      '</div>'+
    '</div>'+
    '<div class="card">'+
      '<div class="field" style="margin-bottom:0;">'+
        '<label>Paste more lines to add (one per line, amount first — e.g. "300 gas bill customer")</label>'+
        '<textarea id="notesPaste" rows="3" placeholder="480 elec bill customer"></textarea>'+
      '</div>'+
      '<div class="btn-row" style="margin-top:10px;"><button class="btn" id="addNotesBtn">Add lines</button></div>'+
    '</div>'+
    (state.legacyNotes.length ? '<button class="btn" id="convertNotesBtn" style="margin-bottom:14px;">Move these into History as entries</button>' : '')+
    '<input type="text" class="search" id="notesSearch" placeholder="Search notes">'+
    '<div id="notesList"></div>'+
    '<div class="btn-row" style="margin-top:14px;">'+
      '<button class="btn secondary" id="exportNotesCsv">Export as CSV</button>'+
      '<button class="btn danger" id="clearNotes">Erase all</button>'+
    '</div>';
  }

  function filteredLegacyNotes(){
    var q = (state.notesSearch||'').trim().toLowerCase();
    if(!q) return state.legacyNotes;
    return state.legacyNotes.filter(function(n){ return n.note.toLowerCase().includes(q); });
  }

  function updateNotesList(){
    var list = filteredLegacyNotes();
    var el = document.getElementById('notesList');
    if(list.length===0){
      el.innerHTML = '<div class="emptystate"><p class="big">No notes here</p><p>Nothing matches that search.</p></div>';
      return;
    }
    el.innerHTML = list.map(function(n){
      return '<div class="txrow" data-id="'+n.id+'">'+
        '<div class="txleft"><div class="txtype">'+esc(n.note)+'</div></div>'+
        '<div class="txright"><div class="txprofit" style="color:'+(n.amount<0?'var(--cost)':'var(--ink)')+'">'+fmtINR(n.amount)+'</div></div>'+
      '</div>';
    }).join('');
    el.querySelectorAll('.txrow').forEach(function(row){
      row.addEventListener('click', function(){
        var id = row.getAttribute('data-id');
        if(confirm('Remove this line from your imported notes?')){
          state.legacyNotes = state.legacyNotes.filter(function(n){return n.id!==id;});
          saveLegacyNotes();
          updateNotesList();
          updateLegacyTotal();
        }
      });
    });
  }

  function updateLegacyTotal(){
    var totalEl = document.getElementById('legacyTotal');
    if(!totalEl) return;
    var total = state.legacyNotes.reduce(function(s,n){return s+n.amount;}, 0);
    totalEl.textContent = fmtINR(total);
  }

  function wireNotesEvents(){
    document.getElementById('notesSearch').addEventListener('input', function(e){
      state.notesSearch = e.target.value;
      updateNotesList();
    });
    document.getElementById('addNotesBtn').addEventListener('click', function(){
      var ta = document.getElementById('notesPaste');
      var parsed = parseLegacyLines(ta.value);
      if(parsed.length===0){ showToast('No valid lines found — start each line with a number'); return; }
      state.legacyNotes = state.legacyNotes.concat(parsed);
      saveLegacyNotes();
      ta.value='';
      updateNotesList();
      updateLegacyTotal();
      showToast(parsed.length+' line'+(parsed.length===1?'':'s')+' added');
    });
    var convertBtn = document.getElementById('convertNotesBtn');
    if(convertBtn) convertBtn.addEventListener('click', async function(){
      if(!confirm('Move all '+state.legacyNotes.length+' lines into History as entries, recording each amount as profit directly? This clears the Notes list.')) return;
      migrateLegacyToTransactions();
      await saveTransactions();
      state.legacyNotes = [];
      await saveLegacyNotes();
      showToast('Moved into History');
      state.view='history';
      renderAll();
    });
    document.getElementById('exportNotesCsv').addEventListener('click', function(){
      var list = filteredLegacyNotes();
      if(list.length===0){ showToast('Nothing to export'); return; }
      var rows = list.map(function(n){ return [n.amount, n.note.replace(/,/g,';')].join(','); });
      var csv = 'Amount,Note\n'+rows.join('\n');
      var blob = new Blob([csv], {type:'text/csv'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href=url; a.download='khata-notes-'+todayISO()+'.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
    document.getElementById('clearNotes').addEventListener('click', async function(){
      if(!confirm('Erase every imported note? This cannot be undone.')) return;
      state.legacyNotes = [];
      await saveLegacyNotes();
      showToast('Imported notes erased');
      renderView();
    });
  }

  // ================= DASHBOARD =================
  function dashboardTemplate(){
    var all = state.transactions;
    var today = todayISO();
    var todayList = all.filter(function(t){return t.date===today;});
    var weekList = all.filter(function(t){ return withinDays(t.date,7); });
    var monthList = all.filter(function(t){ return withinDays(t.date,31); });
    var sToday = computeStats(todayList), sWeek = computeStats(weekList), sMonth = computeStats(monthList), sAll = computeStats(all);

    var byCat = {};
    all.forEach(function(t){
      var key = t.txType==='bill' ? t.category : ('Gift card: '+t.brand);
      byCat[key] = (byCat[key]||0) + t.profit;
    });
    var catEntries = Object.keys(byCat).map(function(k){return {name:k, profit:byCat[k]};}).sort(function(a,b){return b.profit-a.profit;});
    var maxProfit = catEntries.length? catEntries[0].profit : 1;

    var custMap = {};
    all.forEach(function(t){ if(t.customerName){ custMap[t.customerName]=(custMap[t.customerName]||0)+t.profit; } });
    var custEntries = Object.keys(custMap).map(function(k){return {name:k, profit:custMap[k]};}).sort(function(a,b){return b.profit-a.profit;}).slice(0,5);

    return ''+
    '<h2 class="section-title">Dashboard</h2>'+
    '<div class="kpi-grid">'+
      kpi('Today', sToday.profit)+kpi('Last 7 days', sWeek.profit)+
      kpi('Last 30 days', sMonth.profit)+kpi('All time', sAll.profit)+
    '</div>'+
    '<div class="card">'+
      '<h2 class="section-title" style="font-size:15px;">Profit by category</h2>'+
      (catEntries.length? catEntries.map(function(c){
        var pct = Math.max(4, Math.round(c.profit/maxProfit*100));
        return '<div class="barlist-row"><div class="barlist-head"><span class="name">'+esc(c.name)+'</span><span class="amt">'+fmtINR(c.profit)+'</span></div><div class="bartrack"><div class="barfill" style="width:'+pct+'%"></div></div></div>';
      }).join('') : '<p class="helper">No entries yet.</p>')+
    '</div>'+
    (custEntries.length ? '<div class="card">'+
      '<h2 class="section-title" style="font-size:15px;">Top customers</h2>'+
      custEntries.map(function(c){
        return '<div class="barlist-row"><div class="barlist-head"><span class="name">'+esc(c.name)+'</span><span class="amt">'+fmtINR(c.profit)+'</span></div></div>';
      }).join('')+
    '</div>' : '');
  }

  function withinDays(dateStr, days){
    var today = new Date(todayISO()+'T00:00:00');
    var dd = new Date(dateStr+'T00:00:00');
    var diff = Math.round((today-dd)/86400000);
    return diff>=0 && diff<days;
  }

  function kpi(label, val){
    return '<div class="kpi"><p class="label">'+label+'</p><p class="value">'+fmtINR(val)+'</p></div>';
  }

  // ================= SETTINGS =================
  function settingsTemplate(){
    var s = state.settings;
    var cfg = loadFirebaseConfig();
    return ''+
    '<h2 class="section-title">Settings</h2>'+
    '<div class="card">'+
      '<h2 class="section-title" style="font-size:15px;">Cloud sync</h2>'+
      (cfg ?
        ('<p class="helper" style="margin-top:0;">'+(CLOUD_ENABLED? '🟢 Connected — project "'+esc(cfg.projectId)+'". Every save here also updates the cloud, and other devices using the same project will see it when they open the app.' : '🟠 A cloud project is saved on this device but could not be reached just now — working from the local copy.')+'</p>'+
        '<button class="btn secondary" id="disconnectCloud">Disconnect this device</button>')
        :
        ('<p class="helper" style="margin-top:0;">Connect a free Firebase project so this ledger stays in sync across your phone, laptop — anywhere. Create one free at <b>console.firebase.google.com</b> → New project → build a <b>Firestore Database</b> (start in test mode) → Project settings → add a Web app → copy the "firebaseConfig" code block → paste it below.</p>'+
        '<div class="field"><label>Paste your firebaseConfig here</label><textarea id="firebaseConfigInput" rows="6" placeholder="const firebaseConfig = { apiKey: ... }"></textarea></div>'+
        '<button class="btn" id="connectCloud">Connect</button>')
      )+
    '</div>'+
    '<div class="card">'+
      '<div class="field"><label>Shop / ledger name</label><input type="text" id="s-shopname" value="'+esc(s.shopName)+'"></div>'+
    '</div>'+
    '<div class="card">'+
      '<h2 class="section-title" style="font-size:15px;">Bill categories</h2>'+
      '<div class="taglist" id="billCatList">'+s.billCategories.map(function(c,i){return '<span class="chip">'+esc(c)+'<span class="x" data-idx="'+i+'" data-list="billCategories">×</span></span>';}).join('')+'</div>'+
      '<div class="addrow"><input type="text" id="newBillCat" placeholder="Add a bill type"><button id="addBillCat">Add</button></div>'+
    '</div>'+
    '<div class="card">'+
      '<h2 class="section-title" style="font-size:15px;">Gift card brands</h2>'+
      '<div class="taglist" id="giftBrandList">'+s.giftBrands.map(function(c,i){return '<span class="chip">'+esc(c)+'<span class="x" data-idx="'+i+'" data-list="giftBrands">×</span></span>';}).join('')+'</div>'+
      '<div class="addrow"><input type="text" id="newBrand" placeholder="Add a brand"><button id="addBrand">Add</button></div>'+
    '</div>'+
    '<div class="card">'+
      '<h2 class="section-title" style="font-size:15px;">Quick-select % presets</h2>'+
      '<div class="field"><label>My cost % chips</label>'+
        '<div class="taglist" id="costPresetList">'+s.costPresets.map(function(c,i){return '<span class="chip">'+c+'%<span class="x" data-idx="'+i+'" data-list="costPresets">×</span></span>';}).join('')+'</div>'+
        '<div class="addrow"><input type="number" id="newCostPreset" placeholder="e.g. 18"><button id="addCostPreset">Add</button></div>'+
      '</div>'+
      '<div class="field"><label>Customer % chips</label>'+
        '<div class="taglist" id="custPresetList">'+s.customerPresets.map(function(c,i){return '<span class="chip">'+c+'%<span class="x" data-idx="'+i+'" data-list="customerPresets">×</span></span>';}).join('')+'</div>'+
        '<div class="addrow"><input type="number" id="newCustPreset" placeholder="e.g. 9"><button id="addCustPreset">Add</button></div>'+
      '</div>'+
    '</div>'+
    '<div class="card">'+
      '<h2 class="section-title" style="font-size:15px;">Data</h2>'+
      '<div class="btn-row" style="margin-bottom:10px;">'+
        '<button class="btn secondary" id="exportAllCsv">Export all (CSV)</button>'+
        '<button class="btn secondary" id="exportJson">Backup (JSON)</button>'+
      '</div>'+
      '<button class="btn danger" id="clearAll">Erase all data</button>'+
    '</div>';
  }

  function wireSettingsEvents(){
    var s = state.settings;

    var connectBtn = document.getElementById('connectCloud');
    if(connectBtn) connectBtn.addEventListener('click', async function(){
      var text = document.getElementById('firebaseConfigInput').value;
      try{
        var parsed = parseFirebaseConfigText(text);
        localStorage.setItem('khata:firebaseConfig', JSON.stringify(parsed));
        showToast('Connecting…');
        var ok = await initCloud();
        if(ok){
          await cloudPush();
          showToast('Connected — this device is now syncing');
        } else {
          showToast('Could not connect — double-check the config and your Firestore rules');
        }
      }catch(err){
        showToast(err.message || 'Could not read that config');
      }
      renderView();
    });

    var disconnectBtn = document.getElementById('disconnectCloud');
    if(disconnectBtn) disconnectBtn.addEventListener('click', function(){
      if(!confirm('Stop syncing this device? Your data stays right here on this device, it just won\'t update the cloud copy anymore.')) return;
      localStorage.removeItem('khata:firebaseConfig');
      CLOUD_ENABLED = false;
      cloudDb = null;
      showToast('Disconnected');
      renderView();
    });

    document.getElementById('s-shopname').addEventListener('change', function(e){
      s.shopName = e.target.value.trim() || 'Khata';
      saveSettings(); renderStatstrip();
    });

    function wireList(listId, addBtnId, inputId, listKey, isNumber){
      document.getElementById(listId).addEventListener('click', function(e){
        var x = e.target.closest('.x'); if(!x) return;
        var idx = parseInt(x.getAttribute('data-idx'),10);
        s[listKey].splice(idx,1);
        saveSettings(); renderView();
      });
      document.getElementById(addBtnId).addEventListener('click', function(){
        var input = document.getElementById(inputId);
        var val = isNumber ? parseFloat(input.value) : input.value.trim();
        if(!val && val!==0) return;
        if(isNumber && s[listKey].includes(val)) return;
        if(!isNumber){
          var insertAt = s[listKey].length && s[listKey][s[listKey].length-1]==='Other' ? s[listKey].length-1 : s[listKey].length;
          s[listKey].splice(insertAt,0,val);
        } else {
          s[listKey].push(val);
          s[listKey].sort(function(a,b){return b-a;});
        }
        input.value='';
        saveSettings(); renderView();
      });
    }
    wireList('billCatList','addBillCat','newBillCat','billCategories',false);
    wireList('giftBrandList','addBrand','newBrand','giftBrands',false);
    wireList('costPresetList','addCostPreset','newCostPreset','costPresets',true);
    wireList('custPresetList','addCustPreset','newCustPreset','customerPresets',true);

    document.getElementById('exportAllCsv').addEventListener('click', function(){ exportCsv(state.transactions); });
    document.getElementById('exportJson').addEventListener('click', function(){
      var data = JSON.stringify({settings:state.settings, transactions:state.transactions}, null, 2);
      var blob = new Blob([data], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href=url; a.download='khata-backup-'+todayISO()+'.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
    document.getElementById('clearAll').addEventListener('click', async function(){
      if(!confirm('This will permanently erase every saved entry. This cannot be undone. Continue?')) return;
      state.transactions = [];
      await saveTransactions();
      showToast('All entries erased');
      renderAll();
    });
  }

  // ================= NAV =================
  document.querySelector('.bottomnav').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-nav]');
    if(!btn) return;
    if(state.view==='entry' && state.editingId){
      if(!confirm('Discard unsaved edit?')) return;
      state.editingId=null; state.entryDraft = blankDraft();
    }
    state.view = btn.getAttribute('data-nav');
    renderAll();
  });

  loadData();
})();
</script>

    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(e){ console.error('Service worker registration failed', e); });
    });
  }
</script>
